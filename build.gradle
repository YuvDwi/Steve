plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = '1.0.0'
group = 'com.steve.ai'

base {
    archivesName = 'steve-ai-mod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                steve {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                steve {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://lss233.littleservice.cn/repositories/minecraft/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // HTTP client - Using Java 11+ built-in HttpClient (no external dependencies needed!)
    // JSON parsing - Minecraft already includes Gson

    // GraalVM for JavaScript code execution engine
    implementation 'org.graalvm.polyglot:polyglot:23.1.0'
    implementation 'org.graalvm.polyglot:js:23.1.0'

    // Resilience4j for fault tolerance (circuit breaker, retry, rate limiting, bulkhead)
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.1.0'

    // Caffeine cache for LLM response caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Apache Commons for SHA-256 hashing (cache keys)
    implementation 'commons-codec:commons-codec:1.16.0'

    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.0-M3'

    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

configurations {
    shadowLibs
}

// Only include the specific dependencies we need to shade
dependencies {
    shadowLibs 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    shadowLibs 'io.github.resilience4j:resilience4j-circuitbreaker:2.1.0'
    shadowLibs 'io.github.resilience4j:resilience4j-retry:2.1.0'
    shadowLibs 'io.github.resilience4j:resilience4j-ratelimiter:2.1.0'
    shadowLibs 'io.github.resilience4j:resilience4j-bulkhead:2.1.0'
    shadowLibs 'io.modelcontextprotocol.sdk:mcp:2.0.0-M3'
    // commons-codec is already in Forge - no need to shade
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shadowLibs]
    // Do NOT relocate - keep original package names
    // Exclude transitive dependencies that conflict with Forge modules
    dependencies {
        exclude(dependency('com.google.errorprone:.*:.*'))
        exclude(dependency('com.google.code.findbugs:.*:.*'))
        exclude(dependency('org.checkerframework:.*:.*'))
        exclude(dependency('com.google.j2objc:.*:.*'))
        exclude(dependency('com.google.guava:.*:.*'))
        exclude(dependency('org.slf4j:.*:.*'))
        exclude(dependency('commons-codec:.*:.*'))
        exclude(dependency('org.apache.commons:.*:.*'))
    }
}

// Make jar produce the shadow jar output
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Steve AI Mod',
            'Specification-Vendor': 'Steve AI',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'Steve AI'
        ])
    }
    // Use shadowJar as the final output
    dependsOn 'shadowJar'
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact shadowJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
